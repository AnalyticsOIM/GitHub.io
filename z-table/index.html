<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Normal Distribution &amp; Z-Table Explorer — Access</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #dde3ea;
    --text: #1e293b;
    --muted: #64748b;
    --navy: #1b4f72;
    --navy-dark: #153c57;
    --danger: #b91c1c;
    --danger-bg: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .lock-card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 4px solid var(--navy);
    border-radius: 14px;
    padding: 30px 28px 26px 28px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
  }
  .lock-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #e8f1f8;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 6px 0;
    font-size: 1.3rem;
    color: var(--navy);
  }
  p.desc {
    margin: 0 0 20px 0;
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.45;
  }
  label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .input-group {
    position: relative;
    margin-bottom: 14px;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 44px 11px 13px;
    font-size: 1rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    color: var(--text);
    background: #ffffff;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(27, 79, 114, 0.14);
  }
  .toggle-vis {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
  }
  .toggle-vis:hover { color: var(--navy); }
  button.unlock-btn {
    width: 100%;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    background: var(--navy);
    color: #ffffff;
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  button.unlock-btn:hover:not(:disabled) { background: var(--navy-dark); }
  button.unlock-btn:disabled { opacity: 0.6; cursor: wait; }
  .err-msg {
    display: none;
    margin-top: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--danger-bg);
    border: 1px solid #fecaca;
    color: var(--danger);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .err-msg.visible { display: block; }
  .foot-note {
    margin-top: 16px;
    text-align: center;
    font-size: 0.78rem;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="lock-card">
    <div class="lock-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>Course Simulation Access</h1>
    <p class="desc">This interactive Normal Distribution &amp; Z-Table Explorer is password protected. Enter your course access key to continue.</p>

    <form id="unlockForm" autocomplete="off">
      <label for="pwInput">Access Key</label>
      <div class="input-group">
        <input id="pwInput" type="password" placeholder="Enter access key" autofocus required />
        <button type="button" id="toggleBtn" class="toggle-vis">Show</button>
      </div>
      <button type="submit" id="unlockBtn" class="unlock-btn">Unlock Simulation</button>
      <div id="errMsg" class="err-msg"></div>
    </form>

    <div class="foot-note">Protected with AES-256 client-side encryption</div>
  </div>

<script>
(() => {
  const payload = JSON.parse(document.getElementById("encPayload").textContent);
  const form = document.getElementById("unlockForm");
  const pwInput = document.getElementById("pwInput");
  const toggleBtn = document.getElementById("toggleBtn");
  const unlockBtn = document.getElementById("unlockBtn");
  const errMsg = document.getElementById("errMsg");

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function showError(msg) {
    errMsg.textContent = msg;
    errMsg.classList.add("visible");
  }

  toggleBtn.addEventListener("click", () => {
    const showing = pwInput.type === "text";
    pwInput.type = showing ? "password" : "text";
    toggleBtn.textContent = showing ? "Show" : "Hide";
    pwInput.focus();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errMsg.classList.remove("visible");

    if (!window.crypto || !window.crypto.subtle) {
      showError("Your browser requires HTTPS (or localhost) to decrypt this page.");
      return;
    }

    const keyText = pwInput.value;
    if (!keyText) return;

    unlockBtn.disabled = true;
    unlockBtn.textContent = "Decrypting...";

    try {
      const salt = b64ToBytes(payload.salt);
      const iv   = b64ToBytes(payload.iv);
      const tag  = b64ToBytes(payload.tag);
      const ct   = b64ToBytes(payload.ct);

      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(keyText),
        "PBKDF2",
        false,
        ["deriveBits"]
      );

      const bits = await crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: payload.iter,
          hash: "SHA-256",
        },
        baseKey,
        512
      );

      const dk = new Uint8Array(bits);
      const encKeyBytes = dk.slice(0, 32);
      const macKeyBytes = dk.slice(32, 64);

      // Verify HMAC-SHA256 over salt || iv || ct before decrypting
      const macInput = new Uint8Array(salt.length + iv.length + ct.length);
      macInput.set(salt, 0);
      macInput.set(iv, salt.length);
      macInput.set(ct, salt.length + iv.length);

      const macKey = await crypto.subtle.importKey(
        "raw",
        macKeyBytes,
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["verify"]
      );

      const valid = await crypto.subtle.verify("HMAC", macKey, tag, macInput);
      if (!valid) {
        showError("Incorrect access key. Please check capitalization and try again.");
        unlockBtn.disabled = false;
        unlockBtn.textContent = "Unlock Simulation";
        pwInput.select();
        return;
      }

      const aesKey = await crypto.subtle.importKey(
        "raw",
        encKeyBytes,
        { name: "AES-CBC" },
        false,
        ["decrypt"]
      );

      const plainBuf = await crypto.subtle.decrypt(
        { name: "AES-CBC", iv: iv },
        aesKey,
        ct
      );

      const decryptedHtml = new TextDecoder().decode(plainBuf);
      document.open();
      document.write(decryptedHtml);
      document.close();
    } catch (err) {
      showError("Decryption failed. Please check the access key and try again.");
      unlockBtn.disabled = false;
      unlockBtn.textContent = "Unlock Simulation";
    }
  });
})();
</script>
